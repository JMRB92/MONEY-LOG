'use strict';const KEY='moneylog_v101';const $=id=>document.getElementById(id);const uid=()=>crypto.randomUUID?crypto.randomUUID():String(Date.now()+Math.random());const today=()=>new Date().toLocaleDateString('en-CA');const month=()=>today().slice(0,7);const defaultCats=['Alimentación','Vivienda','Transporte','Ocio','Salud','Compras','Educación','Servicios','Otros'];const init=()=>({version:1,accounts:[{id:uid(),name:'Cuenta principal',opening:0}],categories:defaultCats,budgets:[],transactions:[],recurring:[],goals:[],settings:{currency:'EUR',theme:'dark'}});let db;try{db=JSON.parse(localStorage.getItem(KEY))||init()}catch{db=init()}const ensure=()=>{for(const k of ['accounts','categories','budgets','transactions','recurring','goals'])if(!Array.isArray(db[k]))db[k]=[];db.settings ||= {currency:'EUR',theme:'dark'};if(!db.accounts.length)db.accounts.push({id:uid(),name:'Cuenta principal',opening:0})};ensure();let page='Inicio',editing=null;const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(db));render()}catch(e){alert('No se pudo guardar. Revisa el espacio disponible en el navegador.')}};const money=n=>new Intl.NumberFormat('es-ES',{style:'currency',currency:db.settings.currency||'EUR'}).format(Number(n)||0);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const opt=(a,v)=>a.map(x=>`<option value="${esc(x.id??x)}" ${String(x.id??x)===String(v)?'selected':''}>${esc(x.name??x)}</option>`).join('');const btn=(label,fn,cls='')=>`<button class="${cls}" data-act="${fn}">${label}</button>`;const acc=id=>db.accounts.find(x=>x.id===id)?.name||'Cuenta eliminada';const balance=id=>Number(db.accounts.find(a=>a.id===id)?.opening||0)+db.transactions.reduce((s,t)=>s+(t.account===id?(t.type==='income'?+t.amount:t.type==='expense'?-t.amount:t.type==='transfer'?-t.amount:0):0)+(t.type==='transfer'&&t.to===id?+t.amount:0),0);const totals=(m)=>db.transactions.filter(t=>t.date.startsWith(m)).reduce((r,t)=>(t.type const pages=['Inicio','Movimientos','Cuentas','Categorías','Presupuestos','Recurrentes','Metas','Estadísticas','Informes','Ajustes'];function render(){document.body.classList.toggle('light',db.settings.theme==='light');$('nav').innerHTML=pages.map(p=>`<button data-page="${p}" class="${p===page?'active':''}">${p}</button>`).join('');let h='';if(page==='Inicio'){const recent=[...db.transactions].sort((a,b)=>b.date.localeCompare(a.date)).slice(0,7);h=summary()+`<div class="card"><div class="row"><h3>Acciones rápidas</h3><div class="actions">${btn('+ Ingreso','income','primary')}${btn('− Gasto','expense')}${btn('⇄ Transferencia','transfer')}</div></div></div><div class="grid"><div class="card"><h3>Cuentas</h3>${list(db.accounts,a=>`<div class="item"><span>${esc(a.name)}</span><b>${money(balance(a.id))}</b></div>`)}</div><div class="card"><h3>Últimos movimientos</h3>${list(recent,t=>`<div class="item"><div><b>${esc(t.note||t.category||t.type)}</b><div class="pill">${fmt(t.date)} · ${esc(acc(t.account))}</div></div><b class="${t.type==='income'?'green':t.type==='expense'?'red':''}">${t.type==='income'?'+':t.type==='expense'?'−':'⇄'}${money(t.amount)}</b></div>`)}</div></div>`}if(page==='Movimientos'){h=`<div class="card"><div class="row"><h3>Movimientos</h3><div class="actions">${btn('+ Ingreso','income','primary')}${btn('− Gasto','expense')}${btn('⇄ Transferencia','transfer')}</div></div><div class="fields"><div><label>Mes</label><input type="month" id="filterMonth" value="${window.filterMonth||month()}"></div><div><label>Buscar</label><input id="search" placeholder="Concepto o categoría" value="${esc(window.searchText||'')}"></div></div><div id="transactionList"></div></div>`}if(page==='Cuentas'){h=`<div class="card"><div class="row"><h3>Cuentas y saldos</h3>${btn('+ Cuenta','account','primary')}</div>${list(db.accounts,a=>`<div class="item"><div><b>${esc(a.name)}</b><div class="pill">Saldo inicial ${money(a.opening)}</div></div><div><b>${money(balance(a.id))}</b> ${btn('Editar','edit:account:'+a.id)} ${btn('Eliminar','del:account:'+a.id,'danger')}</div></div>`)}</div>`}if(page==='Categorías'){h=`<div class="card"><div class="row"><h3>Categorías</h3>${btn('+ Categoría','category','primary')}</div>${list(db.categories,c=>`<div class="item">${esc(c)} <span>${btn('Editar','edit:category:'+encodeURIComponent(c))} ${btn('Eliminar','del:category:'+encodeURIComponent(c),'danger')}</span></div>`)}</div>`}if(page==='Presupuestos'){const t=totals(month());h=`<div class="card"><div class="row"><h3>Presupuestos · ${month()}</h3>${btn('+ Presupuesto','budget','primary')}</div><p class="muted">Gasto del mes: ${money(t.expense)}</p>${list(db.budgets,b=>{let spent=db.transactions.filter(t=>t.type==='expense'&&t.category===b.category&&t.date.startsWith(month())).reduce((s,t)=>s+ +t.amount,0),pct=Math.min(100,spent/Math.max(0.01,b.limit)*100);return `<div class="item"><div style="flex:1"><div class="row"><b>${esc(b.category)}</b><span>${money(spent)} / ${money(b.limit)}</span></div><div class="bartrack"><div class="barfill" style="width:${pct}%;background:${spent>b.limit?'var(--danger)':'var(--accent)'}"></div></div></div><span>${btn('Editar','edit:budget:'+b.id)} ${btn('Eliminar','del:budget:'+b.id,'danger')}</span></div>`})}</div>`}if(page==='Recurrentes'){h=`<div class="card"><div class="row"><h3>Movimientos recurrentes</h3>${btn('+ Recurrente','recurring','primary')}</div><p class="notice">Los movimientos pendientes se generan al abrir la aplicación. Comprueba los importes antes de cerrar el mes.</p>${list(db.recurring,r=>`<div class="item"><div><b>${esc(r.note||r.category)}</b><div class="pill">${esc(r.frequency)} · próxima fecha ${fmt(r.next)} · ${esc(acc(r.account))}</div></div><span>${money(r.amount)} ${btn('Editar','edit:recurring:'+r.id)} ${btn('Eliminar','del:recurring:'+r.id,'danger')}</span></div>`)}</div>`}if(page==='Metas'){h=`<div class="card"><div class="row"><h3>Metas de ahorro</h3>${btn('+ Meta','goal','primary')}</div>${list(db.goals,g=>`<div class="item"><div style="flex:1"><div class="row"><b>${esc(g.name)}</b><span>${money(g.saved)} / ${money(g.target)}</span></div><div class="bartrack"><div class="barfill" style="width:${Math.min(100,100*g.saved/Math.max(0.01,g.target))}%"></div></div></div><span>${btn('Editar','edit:goal:'+g.id)} ${btn('Eliminar','del:goal:'+g.id,'danger')}</span></div>`)}</div>`}if(page==='Estadísticas'){let m=month(),t=totals(m),cats={};db.transactions.filter(x=>x.type==='expense'&&x.date.startsWith(m)).forEach(x=>cats[x.category]=(cats[x.category]||0)+ +x.amount);h=`${summary()}<div class="grid"><div class="card"><h3>Gastos por categoría · ${m}</h3>${list(Object.entries(cats).sort((a,b)=>b[1]-a[1]),([c,n])=>`<div><div class="row"><span>${esc(c)}</span><b>${money(n)}</b></div><div class="bartrack"><div class="barfill" style="width:${Math.min(100,100*n/Math.max(0.01,t.expense))}%"></div></div></div>`)}</div><div class="card"><h3>Últimos 6 meses</h3><canvas id="chart" width="650" height="290" role="img" aria-label="Ingresos y gastos de los últimos seis meses"></canvas></div></div>`}if(page==='Informes'){h=`<div class="card"><h3>Informes y exportaciones</h3><div class="fields"><div><label>Mes del informe</label><input type="month" id="reportMonth" value="${window.reportMonth||month()}"></div></div><div class="actions">${btn('Exportar movimientos CSV','csv','primary')}${btn('Informe PDF (imprimir)','pdf')}${btn('Copia de seguridad JSON','backup')}${btn('Restaurar JSON','restore')}</div><p class="muted">El informe PDF se obtiene con «Guardar como PDF» en el cuadro de impresión. CSV compatible con Excel. La restauración sustituye todos los datos.</p></div>`}if(page==='Ajustes'){h=`<div class="card"><h3>Preferencias</h3><div class="fields"><div><label>Moneda</label><select id="currency">${opt(['EUR','USD','GBP','MXN','ARS','COP','CLP'],db.settings.currency)}</select></div><div><label>Apariencia</label><select id="theme">${opt([{id:'dark',name:'Oscuro'},{id:'light',name:'Claro'}],db.settings.theme)}</select></div></div><p class="notice">Tus datos permanecen en este navegador. No hay cuentas, sincronización ni acceso bancario. Exporta una copia JSON periódicamente.</p><div class="actions">${btn('Guardar copia','backup')}${btn('Restaurar copia','restore')}${btn('Borrar todos los datos','wipe','danger')}</div></div><div class="card"><h3>Ediciones</h3><p><b>MONEY LOG Gratis:</b> todas las funciones actuales incluidas. <b>MONEY LOG PRO:</b> reservado para futuras funciones avanzadas. No hay compras ni bloqueos en v1.01.</p></div>`}$('app').innerHTML=h;if(page==='Movimientos')drawTransactions();if(page==='Estadísticas')drawChart()}
function drawTransactions(){let m=$('filterMonth').value,q=$('search').value.toLowerCase();window.filterMonth=m;window.searchText=$('search').value;let rows=db.transactions.filter(t=>(!m||t.date.startsWith(m))&&[t.note,t.category,acc(t.account)].join(' ').toLowerCase().includes(q)).sort((a,b)=>b.date.localeCompare(a.date));$('transactionList').innerHTML=list(rows,t=>`<div class="item"><div><b>${esc(t.note||t.category||'Transferencia')}</b><div class="pill">${fmt(t.date)} · ${esc(acc(t.account))}${t.to?' → '+esc(acc(t.to)):''} · ${esc(t.category||t.type)}</div></div><div><b class="${t.type==='income'?'green':t.type==='expense'?'red':''}">${t.type==='income'?'+':t.type==='expense'?'−':'⇄'}${money(t.amount)}</b><div class="actions">${btn('Editar','edit:transaction:'+t.id)}${btn('×','del:transaction:'+t.id,'danger')}</div></div></div>`)}
function drawChart(){let c=$('chart');if(!c)return;let ctx=c.getContext('2d'),w=c.width,h=c.height;ctx.clearRect(0,0,w,h);let arr=Array.from({length:6},(_,i)=>{let d=new Date();d.setDate(1);d.setMonth(d.getMonth()-(5-i));let m=d.toISOString().slice(0,7);return {m,...totals(m)}});let max=Math.max(1,...arr.flatMap(x=>[x.income,x.expense]));ctx.font='14px system-ui';ctx.fillStyle=getComputedStyle(document.body).getPropertyValue('--muted');arr.forEach((x,i)=>{let x0=55+i*97,base=h-45;ctx.fillText(x.m.slice(5),x0+12,h-15);for(let [j,val,color] of [[0,x.income,'#35d0a0'],[1,x.expense,'#ff7887']]){ctx.fillStyle=color;let ht=(h-85)*val/max;ctx.fillRect(x0+j*26,base-ht,23,ht)}});ctx.fillStyle='#35d0a0';ctx.fillRect(15,10,10,10);ctx.fillStyle=getComputedStyle(document.body).getPropertyValue('--fg');ctx.fillText('Ingresos',30,20);ctx.fillStyle='#ff7887';ctx.fillRect(135,10,10,10);ctx.fillStyle=getComputedStyle(document.body).getPropertyValue('--fg');ctx.fillText('Gastos',150,20)}
const field=(name,label,type='text',value='',extra='')=>`<div class="field"><label for="f_${name}">${label}</label><input id="f_${name}" name="${name}" type="${type}" value="${esc(value)}" ${extra}></div>`;const select=(name,label,values,value)=>`<div class="field"><label for="f_${name}">${label}</label><select name="${name}" id="f_${name}">${opt(values,value)}</select></div>`;const positive='required min="0.01" step="0.01"';const acct=()=>select('account','Cuenta',db.accounts,db.accounts[0]?.id);const cat=()=>select('category','Categoría',db.categories,'Otros');function openForm(type,id){editing={type,id};let o=id?(type==='category'?{name:decodeURIComponent(id)}:db[({account:'accounts',budget:'budgets',recurring:'recurring',goal:'goals',transaction:'transactions'})[type]].find(x=>x.id===id)):{};o||={};let h='';if(['income','expense','transfer','transaction'].includes(type)){let t=type==='transaction'?o.type:type;h=select('type','Tipo',[{id:'income',name:'Ingreso'},{id:'expense',name:'Gasto'},{id:'transfer',name:'Transferencia'}],t)+field('amount','Importe','number',o.amount||'',positive)+field('date','Fecha','date',o.date||today(),'required')+select('account','Cuenta de origen',db.accounts,o.account||db.accounts[0].id)+select('to','Cuenta de destino (solo transferencias)',[{id:'',name:'—'} ,...db.accounts],o.to||'')+select('category','Categoría',db.categories,o.category||'Otros')+field('note','Concepto','text',o.note||'')}else if(type==='account')h=field('name','Nombre','text',o.name||'','required')+field('opening','Saldo inicial','number',o.opening??0,'required step="0.01"');else if(type==='category')h=field('name','Nombre','text',o.name||'','required');else if(type==='budget')h=select('category','Categoría',db.categories,o.category||'Otros')+field('limit','Límite mensual','number',o.limit||'',positive);else if(type==='goal')h=field('name','Objetivo','text',o.name||'','required')+field('target','Cantidad objetivo','number',o.target||'',positive)+field('saved','Cantidad ahorrada','number',o.saved??0,'required min="0" step="0.01"');else if(type==='recurring')h=select('type','Tipo',[{id:'income',name:'Ingreso'},{id:'expense',name:'Gasto'}],o.type||'expense')+field('amount','Importe','number',o.amount||'',positive)+select('account','Cuenta',db.accounts,o.account||db.accounts[0].id)+select('category','Categoría',db.categories,o.category||'Otros')+field('note','Concepto','text',o.note||'')+select('frequency','Frecuencia',[{id:'monthly',name:'Mensual'},{id:'weekly',name:'Semanal'},{id:'yearly',name:'Anual'}],o.frequency||'monthly')+field('next','Próxima fecha','date',o.next||today(),'required');$('dlgTitle').textContent=(id?'Editar ':'Nuevo ')+({income:'ingreso',expense:'gasto',transfer:'transferencia',transaction:'movimiento',account:'cuenta',category:'categoría',budget:'presupuesto',goal:'objetivo',recurring:'recurrente'}[type]);$('formFields').innerHTML=`<div class="fields">${h}</div>`;$('dlg').showModal()}
$('form').addEventListener('submit',e=>{e.preventDefault();let {type,id}=editing,d=Object.fromEntries(new FormData(e.target));if(['income','expense','transfer','transaction'].includes(type)){let typ=d.type;if(!Number.isFinite(+d.amount)||+d.amount<=0)return alert('Importe inválido');if(typ==='transfer'&&(!d.to||d.to===d.account))return alert('Selecciona una cuenta de destino distinta');d.amount=+d.amount;d.type=typ;if(typ!=='transfer')delete d.to;if(typ==='transfer')d.category='Transferencia';type='transaction'}else if(type==='account'){d.opening=+d.opening;if(!d.name.trim())return alert('Introduce un nombre')}else if(type==='category'){if(!d.name.trim())return alert('Introduce una categoría');let old=id?decodeURIComponent(id):null;if(db.categories.includes(d.name)&&d.name!==old)return alert('Categoría duplicada');if(old){db.categories=db.categories.map(x=>x===old?d.name:x);for(let k of ['transactions','budgets','recurring'])db[k].forEach(x=>{if(x.category===old)x.category=d.name})}else db.categories.push(d.name);$('dlg').close();return save()}else if(type==='budget'){d.limit=+d.limit;if(d.limit<=0)return alert('Límite inválido');if(db.budgets.some(x=>x.category===d.category&&x.id!==id))return alert('Ya hay presupuesto para esta categoría')}else if(type==='goal'){d.target=+d.target;d.saved=+d.saved;if(d.target<=0||d.saved<0)return alert('Cantidades inválidas')}else if(type==='recurring'){d.amount=+d.amount;if(d.amount<=0)return alert('Importe inválido')}let map={transaction:'transactions',account:'accounts',budget:'budgets',goal:'goals',recurring:'recurring'},arr=db[map[type]];if(id){let i=arr.findIndex(x=>x.id===id);if(i<0)return;arr[i]={...arr[i],...d}}else arr.push({id:uid(),...d});$('dlg').close();save()});$('cancel').onclick=()=>$('dlg').close();function remove(type,id){let map={transaction:'transactions',account:'accounts',budget:'budgets',goal:'goals',recurring:'recurring'};if(type==='account'){if(db.accounts.length===1)return alert('Debe existir al menos una cuenta');if(db.transactions.some(t=>t.account===id||t.to===id)||db.recurring.some(r=>r.account===id))return alert('Esta cuenta tiene movimientos o recurrentes asociados. No puede eliminarse.')}if(type==='category'){let name=decodeURIComponent(id);if(db.categories.length===1)return alert('Debe existir al menos una categoría');if(db.transactions.some(t=>t.category===name)||db.budgets.some(b=>b.category===name)||db.recurring.some(r=>r.category===name))return alert('Categoría en uso: edítala o elimina sus referencias primero');if(confirm('¿Eliminar categoría?')){db.categories=db.categories.filter(c=>c!==name);save()}return}if(!confirm('¿Eliminar este registro?'))return;db[map[type]]=db[map[type]].filter(x=>x.id!==id);save()}
function download(name,content,mime){let url=URL.createObjectURL(new Blob([content],{type:mime})),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),2000)}function backup(){download('moneylog-copia-'+today()+'.json',JSON.stringify(db,null,2),'application/json')}function csv(){let headers=['Fecha','Tipo','Importe','Cuenta','Destino','Categoría','Concepto'],rows=db.transactions.map(t=>[t.date,t.type,t.amount,acc(t.account),t.to?acc(t.to):'',t.category||'',t.note||'']);download('moneylog-movimientos-'+today()+'.csv','\ufeff'+[headers,...rows].map(r=>r.map(v=>'"'+String(v??'').replaceAll('"','""')+'"').join(';')).join('\r\n'),'text/csv;charset=utf-8')}function pdf(){let m=$('reportMonth')?.value||month(),rows=db.transactions.filter(t=>t.date.startsWith(m)).sort((a,b)=>a.date.localeCompare(b.date)),t=totals(m);let win=window.open('','_blank');if(!win)return alert('Permite ventanas emergentes para imprimir el informe');win.document.write(`<!doctype html><html><head><meta charset="utf-8"><title>MONEY LOG ${m}</title><style>body{font:14px system-ui;margin:35px}table{width:100%;border-collapse:collapse}td,th{padding:8px;border-bottom:1px solid #ddd;text-align:left}</style></head><body><h1>MONEY LOG · Informe ${esc(m)}</h1><p>Ingresos: ${money(t.income)} · Gastos: ${money(t.expense)} · Ahorro: ${money(t.income-t.expense)}</p><table><tr><th>Fecha</th><th>Tipo</th><th>Concepto</th><th>Categoría</th><th>Importe</th></tr>${rows.map(x=>`<tr><td>${esc(x.date)}</td><td>${esc(x.type)}</td><td>${esc(x.note)}</td><td>${esc(x.category)}</td><td>${money(x.amount)}</td></tr>`).join('')}</table><script>window.onload=()=>setTimeout(()=>window.print(),250)<\/script></body></html>`);win.document.close()}
function recurring(){let changed=false,now=today();for(let r of db.recurring){let count=0;while(r.next<=now&&count++<120){if(!db.transactions.some(t=>t.recurringId===r.id&&t.date===r.next)){db.transactions.push({id:uid(),recurringId:r.id,type:r.type,amount:+r.amount,account:r.account,category:r.category,note:r.note,date:r.next});changed=true}let d=new Date(r.next+'T12:00:00');if(r.frequency==='weekly')d.setDate(d.getDate()+7);else if(r.frequency==='yearly')d.setFullYear(d.getFullYear()+1);else {let day=d.getDate();d.setDate(1);d.setMonth(d.getMonth()+1);let last=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();d.setDate(Math.min(day,last))}let next=d.toLocaleDateString('en-CA');if(next<=r.next)break;r.next=next;changed=true}}if(changed)try{localStorage.setItem(KEY,JSON.stringify(db))}catch{}}
document.addEventListener('click',e=>{let n=e.target.closest('[data-page],[data-act]');if(!n)return;if(n.dataset.page){page=n.dataset.page;render();return}let a=n.dataset.act;if(a.startsWith('edit:')){let [_,type,...id]=a.split(':');openForm(type,id.join(':'));return}if(a.startsWith('del:')){let [_,type,...id]=a.split(':');remove(type,id.join(':'));return}if(['income','expense','transfer','account','category','budget','goal','recurring'].includes(a))openForm(a);else if(a==='backup')backup();else if(a==='csv')csv();else if(a==='pdf')pdf();else if(a==='restore')$('importFile').click();else if(a==='wipe'&&confirm('¿Borrar TODOS los datos? Esta acción es irreversible.')&&confirm('Última confirmación: ¿eliminar todos los movimientos, cuentas y metas?')){db=init();save()}});document.addEventListener('input',e=>{if(['filterMonth','search'].includes(e.target.id))drawTransactions();if(e.target.id==='reportMonth')window.reportMonth=e.target.value});document.addEventListener('change',e=>{if(e.target.id==='currency'){db.settings.currency=e.target.value;save()}if(e.target.id==='theme'){db.settings.theme=e.target.value;save()}});$('themeBtn').onclick=()=>{db.settings.theme=db.settings.theme==='dark'?'light':'dark';save()};$('importFile').addEventListener('change',async e=>{let file=e.target.files[0];if(!file)return;try{let data=JSON.parse(await file.text());if(!data||!Array.isArray(data.transactions)||!Array.isArray(data.accounts)||!Array.isArray(data.categories)||!Array.isArray(data.budgets)||!Array.isArray(data.recurring)||!Array.isArray(data.goals)||!data.settings||typeof data.settings!=='object')throw Error('Formato incompatible');if(!confirm('¿Sustituir TODOS los datos actuales por los de esta copia?'))return;db=data;ensure();recurring();save();alert('Copia restaurada')}catch(err){alert('No se pudo restaurar: '+err.message)}finally{e.target.value=''}});recurring();render();if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
